<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker - Admin Login</title>
    <link rel="stylesheet" href="ranking.css">
    <style>
        .login-wrapper {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 380px;
        }

        .login-card h1 {
            color: #0b2e1b;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.6em;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95em;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1a7a42;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background: #145c32;
        }

        .alert {
            display: none;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 0.9em;
        }

        .alert-error {
            display: block;
            background: #fdecea;
            color: #b91c1c;
            border: 1px solid #f5c2c0;
        }
    </style>
</head>

<body>
    <div class="container login-wrapper">
        <div class="login-card">
            <h1>🔒 Admin Login</h1>
            <div id="alert-msg" class="alert alert-error"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login">Log In</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const alertEl = document.getElementById('alert-msg');

        function showError(message) {
            alertEl.textContent = message;
            alertEl.style.display = 'block';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            alertEl.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    showError(data.error || 'Login failed.');
                    return;
                }

                window.location.href = 'admin.html';
            } catch (err) {
                showError('Unable to reach the server. Please try again.');
            }
        });
    </script>
</body>

</html>
