<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Admin — Login</title>
    <meta name="description" content="Admin login for the Vibe Poker Game dashboard.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green-dark: #0b2e1b;
            --green-mid: #145c32;
            --green-bright: #1a7a42;
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f0f4f0;
            --text-muted: rgba(240, 244, 240, 0.6);
            --error: #ff6b6b;
            --error-bg: rgba(255, 107, 107, 0.12);
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 30% 20%, #1a4a2e 0%, #0b2e1b 40%, #061a10 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient felt texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 2px,
                    rgba(255,255,255,0.012) 2px,
                    rgba(255,255,255,0.012) 4px
                );
            pointer-events: none;
            z-index: 0;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 480px; height: 480px;
            background: radial-gradient(circle, #ffd700, transparent);
            top: -120px; left: -100px;
            animation-duration: 14s;
        }
        .orb-2 {
            width: 360px; height: 360px;
            background: radial-gradient(circle, #1a7a42, transparent);
            bottom: -80px; right: -80px;
            animation-duration: 10s;
            animation-direction: alternate-reverse;
        }

        @keyframes floatOrb {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.08); }
        }

        /* Card */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 48px 40px;
            box-shadow:
                0 32px 64px rgba(0,0,0,0.5),
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 1px 0 rgba(255,255,255,0.15) inset;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(32px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 16px rgba(255,215,0,0.5));
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 12px rgba(255,215,0,0.4)); }
            50%       { filter: drop-shadow(0 0 24px rgba(255,215,0,0.8)); }
        }

        .logo-area h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo-area p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 400;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.6;
        }

        .form-control {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(240,244,240,0.3);
        }

        .form-control:focus {
            border-color: var(--gold);
            background: rgba(255,215,0,0.05);
            box-shadow: 0 0 0 3px rgba(255,215,0,0.15);
        }

        /* Error alert */
        .alert-error {
            display: none;
            background: var(--error-bg);
            border: 1px solid rgba(255,107,107,0.3);
            border-radius: 10px;
            color: var(--error);
            font-size: 0.875rem;
            font-weight: 600;
            padding: 12px 16px;
            margin-bottom: 20px;
            text-align: center;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold) 0%, #e6b800 100%);
            color: var(--green-dark);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: 0 4px 20px rgba(255,215,0,0.35);
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(255,215,0,0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(11,46,27,0.3);
            border-top-color: var(--green-dark);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading .btn-text { display: none; }
        .btn-login.loading .spinner { display: block; }

        /* Footer */
        .card-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .card-footer a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .card-footer a:hover {
            opacity: 0.75;
        }
    </style>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-card">
        <div class="logo-area">
            <span class="logo-icon">🃏</span>
            <h1>Vibe Poker Admin</h1>
            <p>Enter your credentials to access the dashboard</p>
        </div>

        <div id="error-msg" class="alert-error"></div>

        <form id="login-form" onsubmit="handleLogin(event)" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="admin"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>
            </div>

            <button type="submit" id="login-btn" class="btn-login">
                <span class="btn-text">Sign In →</span>
                <span class="spinner"></span>
            </button>
        </form>

        <p class="card-footer">
            ← <a href="index.html">Back to Ranking</a>
        </p>
    </div>

    <script>
        // If already authenticated, skip login
        if (sessionStorage.getItem('adminToken')) {
            window.location.replace('admin.html');
        }

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('error-msg');

            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            // Loading state
            btn.classList.add('loading');
            btn.disabled = true;
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Login failed. Please try again.');
                }

                // Store token and redirect
                sessionStorage.setItem('adminToken', data.token);
                window.location.replace('admin.html');

            } catch (err) {
                showError(err.message);
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
            // Re-trigger animation
            el.style.animation = 'none';
            el.offsetHeight; // reflow
            el.style.animation = '';
        }
    </script>
</body>

</html>
