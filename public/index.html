<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker</title>
    <link rel="stylesheet" href="ranking.css">
</head>

<body>
    <nav class="navbar">
        <div id="nav-ranking" class="nav-tab active" onclick="switchTab('ranking-tab', this)">🏆 <span
                class="tab-text">Ranking</span></div>
        <div id="nav-players" class="nav-tab" onclick="switchTab('players-tab', this)">👥 <span
                class="tab-text">Players</span></div>
        <div id="nav-addons" class="nav-tab" onclick="switchTab('addons-tab', this)">🃏 <span
                class="tab-text">Game</span></div>
        <div id="nav-hof" class="nav-tab" onclick="switchTab('hof-tab', this)">⭐ <span class="tab-text">Hall of
                Fame</span></div>
    </nav>

    <div class="container">
        <div id="ranking-tab" class="tab-content active">
            <h1>🏆 Poker Ranking 🏆</h1>
            <div id="rankings-container">
                <div class="loading">Loading rankings...</div>
            </div>

            <div class="global-ranking-section">
                <h2 class="year-header">🌍 Global Ranking</h2>
                <div id="global-rankings-container">
                    <!-- Dynamic global ranking content -->
                </div>
            </div>
        </div>

        <div id="players-tab" class="tab-content">
            <h1>👥 Players 👥</h1>
            <div id="players-container" class="players-grid">
                <!-- Dynamic content -->
            </div>
        </div>

        <div id="addons-tab" class="tab-content">
            <h1>🃏 Game 🃏</h1>

            <div class="dashboard-container">
                <!-- Blind Counter Box -->
                <div class="dashboard-box">
                    <h3>📢 Blinds</h3>
                    <div class="blind-input-container" style="margin-top: 10px;">
                        <input type="number" id="blind-base" value="100" step="50" onchange="updateBlinds()">
                    </div>
                    <div class="blind-values">
                        <div class="blind-item">
                            <span class="blind-label">Small Blind</span>
                            <span class="blind-amount" id="sb-amount">50</span>
                        </div>
                        <div class="blind-item">
                            <span class="blind-label">Big Blind</span>
                            <span class="blind-amount" id="bb-amount">100</span>
                        </div>
                    </div>
                    <div class="blind-controls">
                        <button class="dash-btn btn-reset" onclick="adjustBlinds(-100)">-100</button>
                        <button class="dash-btn" style="background: #9e9e9e; color: white;"
                            onclick="resetBlinds()">Reset</button>
                        <button class="dash-btn btn-play" onclick="adjustBlinds(100)">+100</button>
                        <button class="dash-btn btn-play" onclick="adjustBlinds(200)">+200</button>
                        <button class="dash-btn btn-play" onclick="adjustBlinds(500)">+500</button>
                    </div>
                </div>


            </div>

            <div class="summary-bar">
                <div class="multiplier-container">
                    <label>Buy-in: R$</label>
                    <input type="number" id="buyin-multiplier" class="multiplier-input" value="10" min="1"
                        onchange="saveAndRefreshAddons()">
                    <div
                        style="margin-left: 15px; border-left: 1px solid #ccc; padding-left: 15px; display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="global-addon-toggle" onchange="saveAndRefreshAddons()">
                        <label for="global-addon-toggle"
                            style="font-size: 0.9em; font-weight: bold; color: #555; cursor: pointer;">Add-On</label>
                    </div>
                </div>
                <div class="summary-item">Rebuys: <span id="summary-rayon">0</span></div>
                <div class="summary-item" style="color: #555;">Total Chips: <span id="summary-chips">0</span></div>
                <div class="summary-item pot">Pot: R$ <span id="summary-pot">0</span></div>
                <div class="summary-item" style="color: #ffd700; font-size: 1.1em;">1st: R$ <span
                        id="summary-first">0</span></div>
                <div class="summary-item" style="color: #c0c0c0; font-size: 1.1em;">2nd: R$ <span
                        id="summary-second">0</span></div>
            </div>

            <div class="add-player-form">
                <input type="text" id="new-player-name" class="add-player-input" placeholder="New player name...">
                <button class="add-player-btn" onclick="addNewPlayer()">➕ Add Player</button>
            </div>

            <div class="reset-container">
                <button class="copy-list-btn" onclick="sharePlayersList()">📋 Copy Players List</button>
                <button class="add-all-btn" onclick="incrementAllActivePlayers()">➕ Add 1 for All In Game</button>
                <button class="reset-button" onclick="resetAllAddons()">🔄 Reset All Counts</button>
            </div>

            <ul id="addon-list" class="addon-list">
                <!-- Dynamic content -->
            </ul>
        </div>

        <!-- Hall of Fame -->
        <div id="hof-tab" class="tab-content">
            <div class="hall-of-fame">
                <h2>⭐ Hall of Fame ⭐</h2>


                <div class="hof-list" id="hof-list">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>


    </div>

    <!-- Win Dates Modal -->
    <div id="win-dates-modal" class="modal" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <div id="modal-avatar-container"></div>
                <h2 id="modal-person-name"></h2>
                <p class="modal-year">Year: <span id="modal-year"></span></p>
            </div>
            <ul id="dates-list"></ul>
        </div>
    </div>

    <!-- Year History Modal -->
    <div id="year-history-modal" class="modal" onclick="if(event.target === this) closeHistoryModal()">
        <div class="modal-content">
            <span class="close-button" onclick="closeHistoryModal()">&times;</span>
            <div class="modal-header">
                <h2 id="history-modal-title"></h2>
                <p class="modal-year">Full Winners List</p>
            </div>
            <ul id="history-dates-list"></ul>
        </div>
    </div>

    <!-- Player Details Modal -->
    <div id="player-modal" class="modal" onclick="if(event.target === this) closePlayerModal()">
        <div class="modal-content">
            <span class="close-button" onclick="closePlayerModal()">&times;</span>
            <div id="player-modal-content">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>



    <!-- Import database -->
    <script src="database.js"></script>

    <script>
        // Function to format date
        function formatDate(dateString) {
            return dateString;
            // const date = new Date(dateString);
            // const options = { year: 'numeric', month: 'long', day: 'numeric' };
            // return date.toLocaleDateString('pt-BR', options);
        }

        // Function to show win dates modal
        function showWinDates(name, dates, year) {
            const modal = document.getElementById('win-dates-modal');
            const modalName = document.getElementById('modal-person-name');
            const modalYear = document.getElementById('modal-year');
            const datesList = document.getElementById('dates-list');
            const avatarContainer = document.getElementById('modal-avatar-container');

            modalName.textContent = name;
            modalYear.textContent = year;

            const avatarUrl = avatarsData[name];
            avatarContainer.innerHTML = avatarUrl
                ? `<div class="ranking-avatar" style="width: 140px; height: 140px; margin: 0 auto 15px auto;"><img src="${avatarUrl}" alt="${name}"></div>`
                : `<div class="ranking-avatar" style="width: 140px; height: 140px; margin: 0 auto 15px auto; font-size: 4em;">👤</div>`;

            datesList.innerHTML = dates.map((date, index) => `
                <li class="date-item">
                    <span class="date-number">#${index + 1}</span>
                    <span class="date-value">🏆 ${formatDate(date)}</span>
                </li>
            `).join('');

            modal.style.display = 'flex';
        }

        // Function to close modal
        function closeModal() {
            const modal = document.getElementById('win-dates-modal');
            modal.style.display = 'none';
        }

        // Function to show year winners history
        function showYearHistory(year) {
            const modal = document.getElementById('year-history-modal');
            const modalTitle = document.getElementById('history-modal-title');
            const datesList = document.getElementById('history-dates-list');

            modalTitle.textContent = `🏆 ${year} History`;

            // Collect all unique game dates in that year
            const gameDates = new Set();
            rankingsData[year].forEach(player => {
                if (player.dates) {
                    player.dates.forEach(d => gameDates.add(d));
                }
                if (player.sec) {
                    player.sec.forEach(d => gameDates.add(d));
                }
            });

            // Convert to array of game objects
            const games = Array.from(gameDates).map(date => {
                const winner = rankingsData[year].find(player => player.dates && player.dates.includes(date));
                const runnerUp = rankingsData[year].find(player => player.sec && player.sec.includes(date));

                return {
                    date: date,
                    winnerName: winner ? winner.name : null,
                    runnerUpName: runnerUp ? runnerUp.name : null
                };
            });

            // Sort by date (DD/MM/YYYY)
            games.sort((a, b) => {
                const dateA = a.date.split('/').reverse().join('');
                const dateB = b.date.split('/').reverse().join('');
                return dateA.localeCompare(dateB);
            });

            datesList.innerHTML = games.map((game, index) => {
                const winnerAvatarUrl = game.winnerName ? avatarsData[game.winnerName] : null;
                const winnerAvatarDisplay = game.winnerName
                    ? (winnerAvatarUrl
                        ? `<div class="ranking-avatar small" style="width: 30px; height: 30px; margin: 0 10px 0 0;"><img src="${winnerAvatarUrl}" alt="${game.winnerName}"></div>`
                        : `<div class="ranking-avatar small" style="width: 30px; height: 30px; margin: 0 10px 0 0; font-size: 1.2em;">👤</div>`)
                    : '';

                const runnerUpAvatarUrl = game.runnerUpName ? avatarsData[game.runnerUpName] : null;
                const runnerUpAvatarDisplay = game.runnerUpName
                    ? (runnerUpAvatarUrl
                        ? `<div class="ranking-avatar small" style="width: 30px; height: 30px; margin: 0 10px 0 0;"><img src="${runnerUpAvatarUrl}" alt="${game.runnerUpName}"></div>`
                        : `<div class="ranking-avatar small" style="width: 30px; height: 30px; margin: 0 10px 0 0; font-size: 1.2em;">👤</div>`)
                    : '';

                let winnerRow = '';
                if (game.winnerName) {
                    winnerRow = `
                        <div style="display: flex; align-items: center; justify-content: space-between; flex: 1;">
                            <div style="display: flex; align-items: center;">
                                ${winnerAvatarDisplay}
                                <span class="date-value"><strong>${game.winnerName}</strong></span>
                            </div>
                            <span style="font-size: 1.2em; margin-left: 10px;" title="Winner">🥇</span>
                        </div>
                    `;
                }

                let runnerUpRow = '';
                if (game.runnerUpName) {
                    runnerUpRow = `
                        <div style="display: flex; align-items: center; justify-content: space-between; flex: 1;">
                            <div style="display: flex; align-items: center;">
                                ${runnerUpAvatarDisplay}
                                <span class="date-value" style="color: #555;">${game.runnerUpName}</span>
                            </div>
                            <span style="font-size: 1.2em; margin-left: 10px;" title="Runner-up">🥈</span>
                        </div>
                    `;
                }

                return `
                <li class="date-item" style="flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 18px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 6px; margin-bottom: 4px;">
                        <span class="date-number" style="margin-right: 0; width: auto; height: auto; border-radius: 12px; padding: 4px 10px; font-size: 0.8em; white-space: nowrap;">Game #${index + 1}</span>
                        <span style="font-weight: bold; color: #666; font-size: 0.9em;">📅 ${formatDate(game.date)}</span>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        ${winnerRow}
                        ${runnerUpRow}
                    </div>
                </li>
                `;
            }).join('');

            modal.style.display = 'flex';
        }

        // Function to close history modal
        function closeHistoryModal() {
            const modal = document.getElementById('year-history-modal');
            modal.style.display = 'none';
        }

        // Function to show player details modal
        function showPlayerModal(name) {
            const modal = document.getElementById('player-modal');
            const content = document.getElementById('player-modal-content');
            const playerStats = getPlayerStats();
            const stats = playerStats[name];

            if (!stats) return;

            const avatarUrl = avatarsData[name];
            const avatarDisplay = avatarUrl
                ? `<div class="player-avatar" style="width: 200px; height: 200px; margin: 0 auto 20px auto;"><img src="${avatarUrl}" alt="${name}" style="width: 100%; height: 100%; object-fit: cover;"></div>`
                : `<div class="player-avatar" style="width: 200px; height: 200px; margin: 0 auto 20px auto; font-size: 6em;">👤</div>`;

            content.innerHTML = `
                <div class="modal-header">
                    ${avatarDisplay}
                    <h2>${name}</h2>
                </div>
                <div style="text-align: center; font-size: 1.2em;">
                    <div class="player-card-wins" style="font-size: 1.1em; padding: 5px 15px; margin-bottom: 15px;">
                        Total Wins: ${stats.wins} 🏆
                    </div>
                    ${stats.hof > 0 ? `
                        <div class="player-card-hof" style="font-size: 1.1em; padding: 5px 15px; display: block; width: fit-content; margin: 0 auto;">
                            Hall of Fame: ${stats.hof} ⭐
                        </div>
                    ` : ''}
                </div>
            `;

            modal.style.display = 'flex';
        }

        // Function to close player modal
        function closePlayerModal() {
            const modal = document.getElementById('player-modal');
            modal.style.display = 'none';
        }

        // Function to get rank display (medal or number)
        function getRankDisplay(rank) {
            const medals = ['🥇', '🥈', '🥉'];
            if (rank >= 1 && rank <= 3) {
                return `<div class="rank-medal">${medals[rank - 1]}</div>`;
            }
            return `<div class="rank">${rank}</div>`;
        }

        // Function to get rank class (for styling)
        function getRankClass(rank) {
            const classes = ['first', 'second', 'third'];
            return (rank >= 1 && rank <= 3) ? classes[rank - 1] : '';
        }

        // Function to generate trophy icons
        function generateTrophies(wins) {
            let trophiesHTML = '';
            for (let i = 0; i < wins; i++) {
                trophiesHTML += '<span class="trophy-icon">🏆</span>';
            }
            return trophiesHTML;
        }

        // Function to create ranking HTML for a year
        function createYearSection(year, rankings) {
            const hasHistory = rankings.some(p => (p.dates && p.dates.length > 0) || (p.sec && p.sec.length > 0));
            const historyBtn = hasHistory 
                ? `<button class="year-history-btn" onclick="showYearHistory('${year}')" title="Show all winners">📜 History</button>`
                : '';

            return `
                <div class="year-section">
                    <div class="year-header-container">
                        <h2 class="year-header">${year}</h2>
                        ${historyBtn}
                    </div>
                    <ul class="ranking-list">
                        ${rankings.map((person, index) => {
                const rank = rankings.findIndex(p => p.wins === person.wins) + 1;
                const avatarUrl = avatarsData[person.name];
                const avatarDisplay = avatarUrl
                    ? `<div class="ranking-avatar small"><img src="${avatarUrl}" alt="${person.name}"></div>`
                    : `<div class="ranking-avatar small">👤</div>`;
                return `
                            <li class="ranking-item ${getRankClass(rank)}" data-name="${person.name}" data-year="${year}" data-dates='${JSON.stringify(person.dates || [])}'>
                                ${getRankDisplay(rank)}
                                ${avatarDisplay}
                                <div class="person-info">
                                    <div class="person-name">
                                        ${person.name}
                                    </div>
                                    <div class="trophies">
                                        ${generateTrophies(person.wins)}
                                        <span class="win-count">${person.wins} win${person.wins !== 1 ? 's' : ''}</span>
                                    </div>
                                </div>
                            </li>
                        `;
            }).join('')}
                    </ul>
                </div>
            `;
        }

        // Function to load and display rankings
        function loadRankings() {
            const container = document.getElementById('rankings-container');

            try {
                // Sort years in descending order and filter out year 2000
                const years = Object.keys(rankingsData)
                    .filter(year => year !== "2000")
                    .sort((a, b) => b - a);

                // Generate HTML for visible years
                let html = '';
                years.forEach(year => {
                    const activeRankings = rankingsData[year].filter(p => p.wins > 0);
                    if (activeRankings.length > 0) {
                        html += createYearSection(year, activeRankings);
                    }
                });

                container.innerHTML = html;

                // Calculate and generate Global Ranking (excluding hidden years for this page)
                const globalContainer = document.getElementById('global-rankings-container');
                const globalStats = {};
                Object.entries(rankingsData).forEach(([year, yearRankings]) => {
                    yearRankings.forEach(player => {
                        if (!globalStats[player.name]) globalStats[player.name] = 0;
                        globalStats[player.name] += player.wins;
                    });
                });

                const globalRankings = Object.entries(globalStats)
                    .map(([name, wins]) => ({ name, wins }))
                    .sort((a, b) => b.wins - a.wins);

                let globalHtml = `
                    <ul class="ranking-list global-list">
                        ${globalRankings.map((person, index) => {
                    const rank = globalRankings.findIndex(p => p.wins === person.wins) + 1;
                    const avatarUrl = avatarsData[person.name];
                    const avatarDisplay = avatarUrl
                        ? `<div class="ranking-avatar small"><img src="${avatarUrl}" alt="${person.name}"></div>`
                        : `<div class="ranking-avatar small">👤</div>`;
                    return `
                            <li class="ranking-item global-item ${getRankClass(rank)}" onclick="showPlayerModal('${person.name}')" style="cursor: pointer;">
                                ${getRankDisplay(rank)}
                                ${avatarDisplay}
                                <div class="person-info">
                                    <div class="person-name">${person.name}</div>
                                    <div class="trophies">
                                        <span class="win-count">${person.wins} win${person.wins !== 1 ? 's' : ''}</span>
                                    </div>
                                </div>
                            </li>
                        `;
                }).join('')}
                    </ul>
                `;
                globalContainer.innerHTML = globalHtml;

                // Add event listeners to all ranking items
                document.querySelectorAll('.ranking-item').forEach(rankingItem => {
                    rankingItem.addEventListener('click', function () {
                        const name = this.getAttribute('data-name');
                        const year = this.getAttribute('data-year');
                        const dates = JSON.parse(this.getAttribute('data-dates'));
                        showWinDates(name, dates, year);
                    });
                });

            } catch (error) {
                console.error('Error loading rankings:', error);
                container.innerHTML = `
                    <div class="error">
                        <h2>⚠️ Error Loading Rankings</h2>
                        <p>${error.message}</p>
                        <p style="margin-top: 10px; font-size: 0.9em;">
                            Make sure you're running this page through a web server.<br>
                            Run: <code>python3 -m http.server 8000</code><br>
                            Then open: <code>http://localhost:8000/ranking.html</code>
                        </p>
                    </div>
                `;
            }
        }

        function loadHallOfFame() {
            const hofList = document.getElementById('hof-list');

            const getHandType = (hand) => {
                const symbols = (hand.match(/♦️|♠️|♥️|♣️/g) || []).length;
                if (symbols === 4) return "Four of a Kind";
                if (symbols === 5) {
                    if (hand.includes('A') && hand.includes('K') && hand.includes('10')) return "Royal Flush";
                    return "Straight Flush";
                }
                return "Other Hand";
            };

            const grouped = {};
            hallOfFameData.forEach(item => {
                const type = getHandType(item.hand);
                if (!grouped[type]) grouped[type] = [];
                grouped[type].push(item);
            });

            const icons = {
                "Royal Flush": "💎",
                "Straight Flush": "🔥",
                "Four of a Kind": "🌩️"
            };

            const order = ["Royal Flush", "Straight Flush", "Four of a Kind"];
            let html = '';

            order.forEach(type => {
                if (grouped[type]) {
                    html += `<h3 class="hof-section-header">${icons[type] || ''} ${type}</h3>`;
                    html += grouped[type].map(item => {
                        const avatarUrl = avatarsData[item.name];
                        const avatarDisplay = avatarUrl
                            ? `<div class="ranking-avatar small"><img src="${avatarUrl}" alt="${item.name}"></div>`
                            : `<div class="ranking-avatar small">👤</div>`;
                        return `
                        <div class="hof-item" onclick="showPlayerModal('${item.name}')">
                            <div class="hof-info">
                                <span class="hof-date">${item.date}</span>
                                ${avatarDisplay}
                                <span class="hof-name">${item.name}</span>
                                <span class="hof-hand">${item.hand}</span>
                            </div>
                        </div>
                    `;
                    }).join('');
                }
            });

            hofList.innerHTML = html;
        }

        // Function to load and display Players
        function loadPlayers() {
            const container = document.getElementById('players-container');
            const playerStats = getPlayerStats();

            const players = Object.entries(playerStats)
                .sort((a, b) => a[0].localeCompare(b[0])) // Sort alphabetically by name
                .map(([name, stats]) => {
                    const avatarUrl = avatarsData[name];
                    const avatarDisplay = avatarUrl
                        ? `<img src="${avatarUrl}" alt="${name}" style="width: 100%; height: 100%; object-fit: cover;">`
                        : "👤";

                    return `
                        <div class="player-card" onclick="showPlayerModal('${name}')" style="cursor: pointer;">
                            <div class="player-avatar">${avatarDisplay}</div>
                            <div class="player-card-name">${name}</div>
                            <div class="player-card-wins">Total wins: ${stats.wins} 🏆</div>
                            ${stats.hof > 0 ? `<div class="player-card-hof">Hall of Fame: ${stats.hof} ⭐</div>` : ''}
                        </div>
                    `;
                }).join('');

            container.innerHTML = players;
        }

        // Shared helper to get all players and their base stats
        function getPlayerStats() {
            const playerStats = {};

            // Calculate total wins from rankingsData
            Object.values(rankingsData).forEach(yearRankings => {
                yearRankings.forEach(player => {
                    if (!playerStats[player.name]) {
                        playerStats[player.name] = { wins: 0, hof: 0 };
                    }
                    playerStats[player.name].wins += player.wins;
                });
            });

            // Count Hall of Fame mentions
            hallOfFameData.forEach(item => {
                if (!playerStats[item.name]) {
                    playerStats[item.name] = { wins: 0, hof: 0 };
                }
                playerStats[item.name].hof += 1;
            });

            return playerStats;
        }

        // Function to load and display Add-ons
        function loadAddons() {
            const container = document.getElementById('addon-list');
            const playerStats = getPlayerStats();
            const playerNames = Object.keys(playerStats).sort();

            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{"counts":{}, "out":[], "buyin": 10, "manualPlayers": []}');
            const addonData = storageData.counts || {};
            const outPlayers = storageData.out || [];
            const manualPlayers = storageData.manualPlayers || [];

            const allPlayerNames = Array.from(new Set([...playerNames, ...manualPlayers])).sort();

            // Set buyin from storage
            document.getElementById('buyin-multiplier').value = storageData.buyin || 10;

            // Sort logic: active players first, then 'out' players
            const sortedNames = [...allPlayerNames].sort((a, b) => {
                const aOut = outPlayers.includes(a);
                const bOut = outPlayers.includes(b);
                if (aOut && !bOut) return 1;
                if (!aOut && bOut) return -1;
                return a.localeCompare(b);
            });

            container.innerHTML = sortedNames.map(name => {
                const count = addonData[name] || 0;
                const isOut = outPlayers.includes(name);
                const isIn = !isOut;
                const isManual = manualPlayers.includes(name);

                return `
                    <li class="addon-item ${isOut ? 'player-out' : ''}">
                        <div style="display: flex; align-items: center;">
                            ${isManual ? `<button class="delete-player-btn" onclick="removeManualPlayer('${name}')">×</button>` : ''}
                            <div class="out-control">
                                <input type="checkbox" class="out-checkbox" ${isIn ? 'checked' : ''} onchange="togglePlayerIn('${name}')">
                                <span>IN GAME</span>
                            </div>
                            <span class="addon-player-name">${name}</span>
                        </div>
                        <div class="addon-controls">
                            <button class="minus-button" onclick="decrementAddon('${name}')">-</button>
                            <span class="addon-count" id="count-${name}">${count}</span>
                            <button class="plus-button" onclick="incrementAddon('${name}')">+</button>
                        </div>
                    </li>
                `;
            }).join('');

            updateAddonSummary();
        }

        // Function to increment add-on for a player
        function incrementAddon(name) {
            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{"counts":{}, "out":[]}');
            if (!storageData.counts) storageData.counts = {};

            storageData.counts[name] = (storageData.counts[name] || 0) + 1;
            localStorage.setItem('pokerAddons', JSON.stringify(storageData));

            document.getElementById(`count-${name}`).textContent = storageData.counts[name];
            updateAddonSummary();
        }

        // Function to decrement add-on for a player
        function decrementAddon(name) {
            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{"counts":{}, "out":[]}');
            if (!storageData.counts) storageData.counts = {};

            if ((storageData.counts[name] || 0) > 0) {
                storageData.counts[name] -= 1;
                localStorage.setItem('pokerAddons', JSON.stringify(storageData));
                document.getElementById(`count-${name}`).textContent = storageData.counts[name];
                updateAddonSummary();
            }
        }

        // Function to toggle player 'in/out' status
        function togglePlayerIn(name) {
            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{"counts":{}, "out":[]}');
            if (!storageData.out) storageData.out = [];

            const index = storageData.out.indexOf(name);
            if (index > -1) {
                // If it was in the 'out' list, remove it (making it 'IN')
                storageData.out.splice(index, 1);
            } else {
                // If it wasn't in the 'out' list, add it (making it 'OUT')
                storageData.out.push(name);
            }

            localStorage.setItem('pokerAddons', JSON.stringify(storageData));
            loadAddons(); // Reload to apply sorting
        }

        // Function to increment add-on for ALL active players
        function incrementAllActivePlayers() {
            if (!confirm('Add 1 Add-on for ALL "In Game" players?')) return;

            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{"counts":{}, "out":[], "buyin": 10, "manualPlayers": []}');
            const addonData = storageData.counts || {};
            const outPlayers = storageData.out || [];

            const playerStats = getPlayerStats();
            const playerNames = Object.keys(playerStats);
            const manualPlayers = storageData.manualPlayers || [];
            const allPlayerNames = Array.from(new Set([...playerNames, ...manualPlayers]));

            allPlayerNames.forEach(name => {
                if (!outPlayers.includes(name)) { // Only if player is IN GAME
                    addonData[name] = (addonData[name] || 0) + 1;
                }
            });

            storageData.counts = addonData;
            localStorage.setItem('pokerAddons', JSON.stringify(storageData));
            loadAddons();
        }

        // Function to reset all add-ons
        function resetAllAddons() {
            if (confirm('Are you sure you want to reset all add-on counts and player statuses?')) {
                const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{}');
                localStorage.setItem('pokerAddons', JSON.stringify({
                    "counts": {},
                    "out": [],
                    "buyin": 10,
                    "manualPlayers": storageData.manualPlayers || []
                }));
                loadAddons();
            }
        }

        // Function to add a new manual player
        function addNewPlayer() {
            const input = document.getElementById('new-player-name');
            const name = input.value.trim();
            if (!name) return;

            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{"counts":{}, "out":[], "buyin": 10, "manualPlayers": []}');
            if (!storageData.manualPlayers) storageData.manualPlayers = [];

            if (storageData.manualPlayers.includes(name)) {
                alert('Player already exists!');
                return;
            }

            storageData.manualPlayers.push(name);
            localStorage.setItem('pokerAddons', JSON.stringify(storageData));
            input.value = '';
            loadAddons();
        }

        // Function to remove a manual player
        function removeManualPlayer(name) {
            if (!confirm(`Remove player "${name}" from this session?`)) return;

            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{"counts":{}, "out":[], "buyin": 10, "manualPlayers": []}');

            // Remove from manualPlayers list
            storageData.manualPlayers = (storageData.manualPlayers || []).filter(p => p !== name);

            // Remove their addon count
            if (storageData.counts) delete storageData.counts[name];

            // Remove from out list
            if (storageData.out) storageData.out = storageData.out.filter(p => p !== name);

            localStorage.setItem('pokerAddons', JSON.stringify(storageData));
            loadAddons();
        }

        // Function to share or copy player list
        function sharePlayersList() {
            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{"counts":{}, "out":[], "manualPlayers": []}');
            const addonData = storageData.counts || {};
            const outPlayers = storageData.out || [];

            const playerStats = getPlayerStats();
            const playerNames = Object.keys(playerStats);
            const manualPlayers = storageData.manualPlayers || [];
            const allPlayerNames = Array.from(new Set([...playerNames, ...manualPlayers]));

            const inGamePlayers = allPlayerNames
                .filter(name => !outPlayers.includes(name))
                .sort();

            const listText = inGamePlayers
                .map(name => `${name} ${addonData[name] || 0}`)
                .join('\n');

            if (!listText) {
                alert('No players in game!');
                return;
            }

            // If Web Share API is available (usually mobile)
            if (navigator.share) {
                navigator.share({
                    title: 'Poker Players List',
                    text: listText
                }).catch(err => {
                    console.error('Share failed:', err);
                });
                return;
            }

            // Fallback to Clipboard (usually desktop)
            navigator.clipboard.writeText(listText).then(() => {
                const btn = document.querySelector('.copy-list-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ Copied!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Failed to copy to clipboard');
            });
        }

        // Update share button text if sharing is supported
        function initShareButton() {
            if (navigator.share) {
                const btn = document.querySelector('.copy-list-btn');
                if (btn) btn.innerHTML = '📤 Share Players List';
            }
        }



        // Function to update summary (Add-Ons, Pot, and Prizes)
        function updateAddonSummary() {
            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{"counts":{}, "buyin": 10, "out":[], "manualPlayers":[]}');
            const addonData = storageData.counts || {};
            const buyinValue = parseInt(document.getElementById('buyin-multiplier').value) || 10;
            const totalAddons = Object.values(addonData).reduce((sum, val) => sum + val, 0);
            const totalPot = totalAddons * buyinValue;

            // Calculate active players for the global add-on bonus
            const outPlayers = storageData.out || [];
            const playerStats = getPlayerStats();
            const playerNames = Object.keys(playerStats);
            const manualPlayers = storageData.manualPlayers || [];
            const allPlayerNames = Array.from(new Set([...playerNames, ...manualPlayers]));
            const activePlayerCount = allPlayerNames.filter(name => !outPlayers.includes(name)).length;

            const extraChips = document.getElementById('global-addon-toggle').checked ? (activePlayerCount * 5000) : 0;

            const firstPlace = Math.ceil((totalPot * 0.7) / 10) * 10;
            const secondPlace = totalPot - firstPlace;

            document.getElementById('summary-rayon').textContent = totalAddons;
            document.getElementById('summary-chips').textContent = (totalAddons * 5000 + extraChips).toLocaleString();
            document.getElementById('summary-pot').textContent = totalPot;
            document.getElementById('summary-first').textContent = firstPlace;
            document.getElementById('summary-second').textContent = secondPlace;
        }

        // Helper to save buyin and refresh
        function saveAndRefreshAddons() {
            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{"counts":{}, "out":[], "buyin": 10, "globalAddon": false}');
            storageData.buyin = parseInt(document.getElementById('buyin-multiplier').value) || 10;
            storageData.globalAddon = document.getElementById('global-addon-toggle').checked;
            localStorage.setItem('pokerAddons', JSON.stringify(storageData));
            updateAddonSummary();
        }

        // Initialize checkbox state
        function initGlobalAddon() {
            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{}');
            document.getElementById('global-addon-toggle').checked = storageData.globalAddon || false;
        }

        // Function to switch tabs
        function switchTab(tabId, tabElement) {
            // If called without tabElement (on initial load), find it
            if (!tabElement) {
                tabElement = Array.from(document.querySelectorAll('.nav-tab'))
                    .find(tab => tab.getAttribute('onclick').includes(`'${tabId}'`));
            }

            // Update tabs
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            if (tabElement) tabElement.classList.add('active');

            // Update content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');

            // Save to localStorage
            localStorage.setItem('pokerActiveTab', tabId);

            // Initial load for specific tabs if needed

        }



        function updateBlinds() {
            const base = parseInt(document.getElementById('blind-base').value) || 0;
            document.getElementById('sb-amount').textContent = base / 2;
            document.getElementById('bb-amount').textContent = base;

            // Save to localStorage
            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{}');
            storageData.blinds = base;
            localStorage.setItem('pokerAddons', JSON.stringify(storageData));
        }

        function resetBlinds() {
            if (confirm('Reset blinds to 100 / 50?')) {
                document.getElementById('blind-base').value = 100;
                updateBlinds();
            }
        }

        function initBlinds() {
            const storageData = JSON.parse(localStorage.getItem('pokerAddons') || '{}');
            const savedBlinds = storageData.blinds || 100;
            document.getElementById('blind-base').value = savedBlinds;
            updateBlinds();
        }

        function adjustBlinds(amount) {
            const input = document.getElementById('blind-base');
            const newVal = Math.max(0, (parseInt(input.value) || 0) + amount);
            input.value = newVal;
            updateBlinds();
        }

        // Load rankings and Hall of Fame when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadRankings();
            loadPlayers();
            loadAddons();
            loadHallOfFame();

            initBlinds();
            initGlobalAddon();
            initShareButton();

            // Restore active tab
            const lastTab = localStorage.getItem('pokerActiveTab') || 'ranking-tab';
            switchTab(lastTab);
        });
    </script>
</body>
